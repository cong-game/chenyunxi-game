<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎮 陈芸汐大挑战</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "微软雅黑", sans-serif;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #f0e6fa;
        }
        .game-container {
            width: 100%;
            max-width: 500px;
            height: 400px;
            background: url("background.png") center/cover no-repeat;
            position: relative;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .title {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            color: #800080;
            font-size: 20px;
            font-weight: bold;
            text-align: center;
            background: rgba(240, 230, 250, 0.8);
            padding: 5px 15px;
            border-radius: 5px;
        }
        .rule {
            position: absolute;
            top: 50px;
            left: 10px;
            color: #333;
            font-size: 14px;
            background: rgba(240, 230, 250, 0.8);
            padding: 3px 8px;
            border-radius: 3px;
        }
        .status {
            position: absolute;
            top: 95px;
            left: 10px;
            color: #006400;
            font-size: 14px;
            background: rgba(240, 230, 250, 0.8);
            padding: 3px 8px;
            border-radius: 3px;
        }
        .guess-input {
            position: absolute;
            top: 190px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 35px;
            border: 3px groove #e63946;
            background: #e8a8b8;
            color: #e63946;
            font-size: 16px;
            text-align: center;
            border-radius: 5px;
            outline: none;
        }
        .btn-group {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
        }
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .btn:hover {
            opacity: 0.9;
        }
        .check-btn {
            background: #4169e1;
        }
        .reset-btn {
            background: #32cd32;
        }
        .result {
            position: absolute;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 16px;
            color: blue;
            background: rgba(240, 230, 250, 0.8);
            padding: 5px 10px;
            border-radius: 5px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="title">🎮 陈芸汐大挑战 🎮</div>
        <div class="rule">规则：猜1-100之间的数字<br>我会提示你大了/小了</div>
        <div class="status" id="status">当前最高分：∞ 次 | 第 1 次猜测</div>
        <input type="number" class="guess-input" id="guessInput" placeholder="输入数字" min="1" max="100">
        <div class="btn-group">
            <button class="btn check-btn" onclick="checkGuess()">确认猜测</button>
            <button class="btn reset-btn" onclick="resetGame()">重新开始</button>
        </div>
        <div class="result" id="result"></div>
    </div>

    <script>
        let bestScore = Infinity;
        let secretNum = 0;
        let guessCount = 0;

        // 初始化游戏
        function resetGame() {
            secretNum = Math.floor(Math.random() * 100) + 1;
            guessCount = 0;
            document.getElementById('guessInput').value = '';
            document.getElementById('result').textContent = '';
            updateStatus();
        }

        // 更新状态显示
        function updateStatus() {
            document.getElementById('status').textContent = `当前最高分：${bestScore === Infinity ? '∞' : bestScore} 次 | 第 ${guessCount + 1} 次猜测`;
        }

        // 检查猜测
        function checkGuess() {
            const guessInput = document.getElementById('guessInput');
            const guess = parseInt(guessInput.value);
            const resultEl = document.getElementById('result');

            // 输入验证
            if (isNaN(guess) || guess < 1 || guess > 100) {
                alert("请输入 1-100 之间的整数！");
                return;
            }

            guessCount++;
            updateStatus();

            // 判断结果
            if (guess > secretNum) {
                resultEl.textContent = `📈 太大啦！目标数字比 ${guess} 小一点~`;
            } else if (guess < secretNum) {
                resultEl.textContent = `📉 太小啦！目标数字比 ${guess} 大一点~`;
            } else {
                if (guessCount < bestScore) {
                    bestScore = guessCount;
                    alert(`🎉 猜对啦！你用了 ${guessCount} 次！\n🌟 新纪录！打破最高分！`);
                } else {
                    alert(`🎉 猜对啦！你用了 ${guessCount} 次！`);
                }
                resetGame();
            }
        }

        // 回车也能提交猜测
        document.getElementById('guessInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                checkGuess();
            }
        });

        // 页面加载时初始化游戏
        resetGame();
    </script>
</body>
</html>
