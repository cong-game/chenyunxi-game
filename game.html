<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎮 陈芸汐大挑战 - 多人进阶版</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "微软雅黑", sans-serif;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #f0e6fa;
        }
        .game-container {
            width: 100%;
            max-width: 500px;
            height: 720px;
            background: url("background.png") center/cover no-repeat;
            position: relative;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            padding: 12px;
        }
        .title {
            color: #800080;
            font-size: 20px;
            font-weight: bold;
            text-align: center;
            background: rgba(240, 230, 250, 0.92);
            padding: 8px;
            border-radius: 6px;
            margin-bottom: 10px;
        }
        .setup {
            background: rgba(240, 230, 250, 0.92);
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 10px;
        }
        .row {
            margin: 8px 0;
        }
        .player-setup {
            display: flex;
            gap: 10px;
            margin: 6px 0;
        }
        input,select {
            width: 100%;
            padding: 6px;
            border-radius: 4px;
            border: 1px solid #ccc;
            font-size: 14px;
        }
        .btn {
            padding: 9px 16px;
            border: none;
            border-radius: 5px;
            font-size: 14px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            margin: 3px;
        }
        .add-btn{background:#2196F3;}
        .start-btn{background:#4CAF50;width:100%;margin-top:8px;}
        .check-btn{background:#4169e1;}
        .reset-btn{background:#f44336;}

        .game-area{display:none;}
        .status {
            background: rgba(240, 230, 250, 0.92);
            padding: 8px;
            border-radius: 5px;
            margin: 8px 0;
            color: #006400;
        }
        .guess-area{display:flex;gap:10px;margin:10px 0;}
        .guess-input {
            flex:1;
            padding:8px;
            border:3px groove #e63946;
            background:#e8a8b8;
            color:#e63946;
            font-size:16px;
            text-align:center;
            border-radius:5px;
            outline:none;
        }
        .log-area {
            background: rgba(240, 230, 250, 0.92);
            padding:10px;
            border-radius:5px;
            max-height:260px;
            overflow-y:auto;
            font-size:14px;
        }
        .log-item{margin:4px 0;padding:2px 0;border-bottom:1px solid #ddd;}
        .winner {
            background:#fff0f5;
            color:#d62828;
            font-weight:bold;
            font-size:17px;
            text-align:center;
            padding:10px;
            border-radius:6px;
            margin-top:10px;
            display:none;
        }
        .punish{color:#c70000;font-weight:bold;margin-top:6px;}
    </style>
</head>
<body>
    <div class="game-container">
        <div class="title">🎮 陈芸汐大挑战 · 多人进阶版</div>

        <!-- 开局设置 -->
        <div class="setup" id="setupArea">
            <div class="row">
                <label>🎯 选择数字难度范围：</label>
                <select id="rangeSel">
                    <option value="100">简单：1 ~ 100</option>
                    <option value="200" selected>中等：1 ~ 200</option>
                    <option value="500">困难：1 ~ 500</option>
                </select>
            </div>
            <div class="row">
                <label>👥 添加玩家（2–10人）</label>
                <div id="playerList">
                    <div class="player-setup">
                        <input type="text" placeholder="玩家1昵称">
                    </div>
                </div>
                <button class="btn add-btn" onclick="addPlayer()">+ 添加玩家</button>
            </div>
            <button class="btn start-btn" onclick="startGame()">开始对局</button>
        </div>

        <!-- 游戏界面 -->
        <div class="game-area" id="gameArea">
            <div class="status" id="status"></div>
            <div class="guess-area">
                <input type="number" class="guess-input" id="guessInput" placeholder="输入数字">
                <button class="btn check-btn" onclick="checkGuess()">确认猜测</button>
            </div>
            <button class="btn reset-btn" onclick="backSet()">重新开局</button>

            <div class="log-area" id="logArea"><b>对局记录</b></div>
            <div class="winner" id="winner"></div>
        </div>
    </div>

<script>
// 惩罚库
const punishList = [
    "唱一小段歌🎤",
    "做5个深蹲💪",
    "学小动物叫声🐱",
    "说一句搞笑口头禅🤪",
    "原地转三圈⭕",
    "模仿表情包动作😜",
    "背诵一句古诗📜",
    "夸在场所有人一句💖"
];

let players = [];
let maxNum = 200;
let secretNum = 0;
let currentIdx = 0;
let round = 1;

// 添加玩家
function addPlayer(){
    const wrap = document.getElementById("playerList");
    let num = wrap.children.length + 1;
    if(num >= 10){alert("最多10人！");return;}
    let div = document.createElement("div");
    div.className="player-setup";
    div.innerHTML = `<input type="text" placeholder="玩家${num}昵称">`;
    wrap.appendChild(div);
}

// 开始游戏
function startGame(){
    // 读取范围
    maxNum = parseInt(document.getElementById("rangeSel").value);
    // 读取玩家
    let inputs = document.querySelectorAll("#playerList input");
    players = [];
    for(let i of inputs){
        let n = i.value.trim();
        if(!n){alert("请填好所有玩家昵称！");return;}
        players.push(n);
    }
    if(players.length < 2){alert("至少2人游玩！");return;}

    // 生成目标数字
    secretNum = Math.floor(Math.random() * maxNum) + 1;
    currentIdx = 0; round = 1;

    // 切换界面
    document.getElementById("setupArea").style.display="none";
    document.getElementById("gameArea").style.display="block";
    document.getElementById("logArea").innerHTML = "<b>对局记录：</b>";
    document.getElementById("winner").style.display="none";

    updateTip();
}

// 更新轮到谁
function updateTip(){
    document.getElementById("status").innerText =
    `范围：1~${maxNum}｜第${round}轮｜轮到：${players[currentIdx]}`;
}

// 猜数字
function checkGuess(){
    let val = document.getElementById("guessInput").value;
    let num = parseInt(val);
    let log = document.getElementById("logArea");

    if(isNaN(num) || num < 1 || num > maxNum){
        alert(`请输入 1 ~ ${maxNum} 之间的数字！`);
        return;
    }

    let nowP = players[currentIdx];
    let text = "";

    if(num > secretNum){
        text = `${nowP} 猜 ${num} → 太大`;
    }else if(num < secretNum){
        text = `${nowP} 猜 ${num} → 太小`;
    }else{
        // 猜对获胜
        text = `🎉 ${nowP} 猜对${secretNum}，本局胜利！`;
        // 随机惩罚剩下所有人
        let randomPunish = punishList[Math.floor(Math.random()*punishList.length)];
        let winBox = document.getElementById("winner");
        winBox.innerHTML = `
            🏆 ${nowP} 获胜！<br>
            <div class="punish">💥 其余玩家惩罚：${randomPunish}</div>
        `;
        winBox.style.display = "block";
    }

    // 写入记录
    let item = document.createElement("div");
    item.className="log-item";
    item.innerText = text;
    log.appendChild(item);
    log.scrollTop = log.scrollHeight;

    document.getElementById("guessInput").value = "";

    // 没猜对就换人
    if(num !== secretNum){
        currentIdx ++;
        if(currentIdx >= players.length){
            currentIdx = 0;
            round ++;
        }
        updateTip();
    }
}

// 返回设置页
function backSet(){
    document.getElementById("setupArea").style.display="block";
    document.getElementById("gameArea").style.display="none";
}

// 回车提交
document.getElementById("guessInput").addEventListener("keydown",e=>{
    if(e.key==="Enter") checkGuess();
})
</script>
</body>
</html>
